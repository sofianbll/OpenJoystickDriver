name: CI

on:
  push:
    branches:
      - ci/switch-pro-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-swiftpm:
    name: macOS SwiftPM
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 747ff1ad8964ebf6f209ee0f030a4fb2515efe1f
          persist-credentials: false
          # `check schemas` compares the CLI output schema with the last release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          # environment.sh selects Xcode's swift and stops unless it is the version .swift-version names.
          bash -c 'source Scripts/Platform/environment.sh && echo "$SWIFT_PATH" && "$SWIFT_PATH" --version'

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          for dependency in bun just markdownlint-cli2 pkg-config pyright ruff sdl3 shellcheck swift-format swiftlint xmake; do
            brew list --versions "$dependency" >/dev/null 2>&1 || brew install "$dependency"
          done
          bun install --frozen-lockfile --ignore-scripts
          python3 -m venv .build/schema-validator
          .build/schema-validator/bin/python -m pip install -r Scripts/Quality/requirements.txt
          echo "$PWD/.build/schema-validator/bin" >> "$GITHUB_PATH"
          git rev-parse HEAD | tee .build/switch-pro-ci-source.log

      # Each source is stored under its locked sha256 and checked on read, so a run downloads only changed sources.
      - name: Cache controller catalog sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/catalog-sources
          key: catalog-sources-${{ hashFiles('ControllerSources.lock.json') }}

      - name: Retry CLI launch suite on the contribution tree
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          from Scripts.Command.execution import (
              PROJECT_DIR,
              executed_test_count,
              run_without_warnings,
              swift_command,
          )

          status, output = run_without_warnings(
              swift_command(["test", "--no-parallel", "--filter", "VirtualLaunchCommandTests"]),
              PROJECT_DIR,
          )
          Path(".build/switch-pro-ci-cli-launch.log").write_text(output)
          if status:
              raise SystemExit(status)
          if executed_test_count(output) == 0:
              raise SystemExit("CLI launch suite executed no tests")
          PY

      - name: Upload validation logs and Swift-generated snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switch-pro-validation-${{ github.sha }}
          path: |
            .build/switch-pro-ci-*.log
            Tests/EquivalenceSnapshots/sdl-mappings.txt
            Tests/EquivalenceSnapshots/output-mapping.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
