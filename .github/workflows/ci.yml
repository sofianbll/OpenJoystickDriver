name: CI

on:
  push:
    branches:
      - ci/switch-pro-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-swiftpm:
    name: macOS SwiftPM
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `check schemas` compares the CLI output schema with the last release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          # environment.sh selects Xcode's swift and stops unless it is the version .swift-version names.
          bash -c 'source Scripts/Platform/environment.sh && echo "$SWIFT_PATH" && "$SWIFT_PATH" --version'

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          for dependency in bun just markdownlint-cli2 pkg-config pyright ruff sdl3 shellcheck swift-format swiftlint xmake; do
            brew list --versions "$dependency" >/dev/null 2>&1 || brew install "$dependency"
          done
          bun install --frozen-lockfile --ignore-scripts
          python3 -m venv .build/schema-validator
          .build/schema-validator/bin/python -m pip install -r Scripts/Quality/requirements.txt
          echo "$PWD/.build/schema-validator/bin" >> "$GITHUB_PATH"

      # Each source is stored under its locked sha256 and checked on read, so a run downloads only changed sources.
      - name: Cache controller catalog sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/catalog-sources
          key: catalog-sources-${{ hashFiles('ControllerSources.lock.json') }}

      - name: Build package and run focused offline tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from Scripts.Command.execution import (
              PROJECT_DIR,
              executed_test_count,
              run_without_warnings,
              swift_command,
          )

          focused = (
              "SwitchPro|VirtualHostReport|UserSpaceInputReportState|ReportSender|"
              "VirtualHIDProfile|VirtualDeviceTests|VirtualGamepadMapping|VirtualCommandTests|"
              "VirtualFeed|EndpointMessages|InputTestPresentation|IOHIDVirtualDevicePublisher"
          )
          commands = [
              ("build", ["build", "--build-tests"]),
              ("focused", ["test", "--skip-build", "--no-parallel", "--filter", focused]),
          ]
          for label, arguments in commands:
              status, output = run_without_warnings(swift_command(arguments), PROJECT_DIR)
              Path(f".build/switch-pro-ci-{label}.log").write_text(output)
              if status:
                  raise SystemExit(status)
              if label == "focused" and executed_test_count(output) == 0:
                  raise SystemExit("Focused test run executed no tests")
          PY

      - name: Generate equivalence snapshots with Swift
        run: |
          set -o pipefail
          ./Scripts/ojd snapshots write 2>&1 | tee .build/switch-pro-ci-snapshots.log

      - name: Reject snapshot changes outside the Nintendo sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from Scripts.Quality.equivalence_snapshots import parse_header, parse_sections

          expected = {
              "Tests/EquivalenceSnapshots/sdl-mappings.txt": "SwitchPro",
              "Tests/EquivalenceSnapshots/output-mapping.txt": "switch-pro",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          assert changed <= set(expected), f"Unexpected generated changes: {changed}"
          for name, section in expected.items():
              before = subprocess.check_output(["git", "show", f"HEAD:{name}"], text=True)
              after = Path(name).read_text()
              assert parse_header(before) == parse_header(after), name
              recorded, generated = parse_sections(before), parse_sections(after)
              assert set(generated) == set(recorded) | {section}, name
              assert all(generated[key] == value for key, value in recorded.items()
                         if key != section), name
          print("Only Nintendo sections may differ; existing persona sections are preserved.")
          PY

      - name: Complete repository checks
        run: |
          set -o pipefail
          just check 2>&1 | tee .build/switch-pro-ci-full.log

      - name: Upload validation logs and Swift-generated snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switch-pro-validation-${{ github.sha }}
          path: |
            .build/switch-pro-ci-*.log
            Tests/EquivalenceSnapshots/sdl-mappings.txt
            Tests/EquivalenceSnapshots/output-mapping.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
